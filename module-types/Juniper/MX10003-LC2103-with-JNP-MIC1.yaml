---
manufacturer: Juniper
model: MX10003-LC2103 with JNP-MIC1
comments: |
  [MX10003 Universal Routing Platform Hardware Guide](https://networkingdocs.hpe.com/documentation/us/en/hardware/mx10003/mx10003.pdf)

  MX10003 MPC (Multi-Rate) with the Multi-Rate Ethernet MIC (JNP-MIC1 or JNP-MIC1-MACSEC) in its MIC slot.
  PIC 0: six built-in QSFP+ ports (40GbE or 4x10GbE). PIC 1: twelve QSFP28 ports (100GbE, 40GbE or 4x10GbE).
